[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-service"
version = "0.2.0"
description = "Regional Transport & Logistics Analytics Graph Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "osmnx>=2.1.0",
    "networkx>=3.2.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "requests>=2.31.0",
    "pytest>=8.0.0",
    "aiokafka>=0.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
